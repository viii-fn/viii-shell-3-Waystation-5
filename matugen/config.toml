# Everything: shell + system apps. Used by: viii-theme <image>
# Add an app = add a [templates.x] block here + a file in templates/. Outputs are generated, never edit them.
[config]

[templates.shell]
input_path = '~/viii-shell-3/matugen/templates/theme.json'
output_path = '~/.cache/viii/theme.json'

[templates.kitty]
input_path = '~/viii-shell-3/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/viii-colors.conf'

[templates.fish]
input_path = '~/viii-shell-3/matugen/templates/fish.fish'
output_path = '~/.config/fish/conf.d/viii-colors.fish'

[templates.gtk3]
input_path = '~/viii-shell-3/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/viii-shell-3/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
