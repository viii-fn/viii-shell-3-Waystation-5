# Set custom format with Directory -> Git modules -> Lambda prompt character
format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$line_break\
$character"""

# Don't add a line break at the start of the prompt
add_newline = true

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false

[character]
success_symbol = "[λ](bold blue) "
error_symbol = "[∴](bold red) "
vimcmd_symbol = "[»](bold orange) "

# --- Git Modules ---

[git_branch]
symbol = " "
style = "bold purple"

[git_commit]
commit_hash_length = 7
tag_symbol = "🏷️ "
style = "bold green"
only_detached = false

[git_state]
style = "bold yellow"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = false
disabled = false

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
