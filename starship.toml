# Set custom format with Directory -> Git modules -> Lambda prompt character
format = "$line_break$directory$git_branch$git_commit$git_state$git_metrics$git_status$cmd_duration$character"

# Don't add a line break at the start of the prompt
add_newline = false

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[$duration]($style) "

[directory]
style = "white"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ●"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[∴](bold) "
error_symbol = "[λ](bold red) "
vimcmd_symbol = "[»](bold orange) "

# --- Git Modules ---

[git_branch]
symbol = " "
style = "bold purple"

[git_commit]
commit_hash_length = 7
tag_symbol = "🏷️ "
style = "bold green"
only_detached = false

[git_state]
style = "bold yellow"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = false
disabled = false

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
